# Eclipse Mosquitto v2.x Configuration — Local IoT Prototype

# 1. Listen on port 1883 across all network interfaces (localhost + LAN/Wi-Fi ESP32 devices)
listener 1883 0.0.0.0

# 2. Allow unauthenticated connections for local prototype testing
allow_anonymous true

# 3. Output all logs directly to the console in real time
log_dest stdout
log_type all
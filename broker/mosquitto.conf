# Eclipse Mosquitto 2.x — one broker per laptop.
# Sensors, Node-RED, and the aggregator on this laptop talk only to this broker.
# Loopback does not need a Windows Firewall rule.

listener 1883 127.0.0.1
allow_anonymous true

log_dest stdout
log_type all

# -----------------------------------------------------------------------------
# OPTIONAL 1 — Tailscale listener
#
# Mosquitto fails to start if this address is not up yet. Start Tailscale first
# (`tailscale ip -4`), put that address below, then start Mosquitto.
#
# per_listener_settings must be on before a listener can set its own
# allow_anonymous. Uncomment per_listener_settings once, then set
# allow_anonymous on EVERY listener, including the loopback listener above.
#
# Firewall for this listener only (Administrator PowerShell):
#   New-NetFirewallRule -DisplayName "Mosquitto MQTT Tailscale" -Direction Inbound -Protocol TCP -LocalPort 1883 -RemoteAddress 100.64.0.0/10 -Action Allow
#
# per_listener_settings true
# listener 1883 100.x.x.x
# allow_anonymous true
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# OPTIONAL 2 — Wi-Fi LAN listener for real ESP32 devices
#
# ESP32s are on the Wi-Fi LAN. They are not on Tailscale. A Tailscale-only
# broker cannot see them. Do not publish 1883 to the whole internet.
#
# Password file (run in this directory):
#   mosquitto_passwd -c passwords.txt sensor
#   mosquitto_passwd passwords.txt aggregator
#
# ACL file (acl.conf), Mosquitto 2.x:
#   user sensor
#   topic write sensor/flow
#   topic read actuation/valve
#
#   user aggregator
#   topic read sensor/flow
#   topic write actuation/valve
#
# With per_listener_settings true, allow_anonymous and the password/ACL lines
# apply to the listener most recently declared. Repeat them per listener.
#
# per_listener_settings true
# listener 1883 0.0.0.0
# allow_anonymous false
# password_file passwords.txt
# acl_file acl.conf
# -----------------------------------------------------------------------------

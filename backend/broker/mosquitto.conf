# Eclipse Mosquitto 2.x. One broker per laptop.
# Node-RED, the aggregator and (for now) the simulated sensors on this laptop talk only
# to this broker. Loopback needs no Windows Firewall rule.
#
# per_listener_settings MUST be the first setting in the file. Mosquitto refuses to start
# if it comes after allow_anonymous, password_file or acl_file. With it on, every
# listener has its own allow_anonymous / password_file / acl_file, and each of those
# lines applies to the listener declared just above it.
per_listener_settings true

# --- Active listener: this laptop only -------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous true

log_dest stdout
log_type all

# -----------------------------------------------------------------------------
# OPTIONAL 1: Tailscale listener (other laptops reaching this broker)
#
# Mosquitto fails to start if this address does not exist yet, so start Tailscale
# FIRST, check the address with `tailscale ip -4`, paste it below, then start Mosquitto.
# Firewall rule for this listener only (Administrator PowerShell):
#   New-NetFirewallRule -DisplayName "Mosquitto MQTT Tailscale" -Direction Inbound -Protocol TCP -LocalPort 1883 -RemoteAddress 100.64.0.0/10 -Action Allow
#
# listener 1883 100.x.x.x
# allow_anonymous true
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# OPTIONAL 2: Wi-Fi LAN listener for real ESP32 devices
#
# ESP32s are on the Wi-Fi LAN. They are NOT on Tailscale, so a Tailscale-only broker
# cannot see them. This listener uses its own port (1884) and this laptop's LAN
# address, so it never collides with the loopback listener. The ESP32 connects to
# <laptop LAN IP>:1884 with a user name and password. Do not publish it to the internet.
#
# 1. Create the password file (in this folder; -c creates, so use it only for the first user):
#      mosquitto_passwd -c passwords.txt sensor
#      mosquitto_passwd passwords.txt aggregator
# 2. Create acl.conf next to this file:
#      user sensor
#      topic write sensor/flow
#      topic read actuation/valve
#
#      user aggregator
#      topic read sensor/flow
#      topic write actuation/valve
# 3. Firewall rule (Administrator PowerShell):
#      New-NetFirewallRule -DisplayName "Mosquitto MQTT LAN" -Direction Inbound -Protocol TCP -LocalPort 1884 -RemoteAddress LocalSubnet -Profile Private -Action Allow
# 4. Put this laptop's LAN address below (ipconfig) and remove the leading '#'.
#
# listener 1884 192.168.x.x
# allow_anonymous false
# password_file passwords.txt
# acl_file acl.conf
# -----------------------------------------------------------------------------
